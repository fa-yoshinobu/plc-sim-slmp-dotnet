name: Release

# v で始まるタグ（例: v0.2.0）を push すると、1 ファイル exe（.NET ランタイム同梱）の配布 zip を作り、
# GitHub Release に添付する。本文は .github/release-notes.md の Changes 欄から作る。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    outputs:
      release_tag: ${{ steps.publish_release.outputs.release_tag }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify application version
        shell: pwsh
        env:
          CHECK_TAG: ${{ github.ref_name }}
        run: |
          if ($env:CHECK_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') { throw 'Use a SemVer tag such as v1.2.3.' }
          [xml]$project = Get-Content -LiteralPath 'Directory.Build.props'
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ($version -cne $env:CHECK_TAG.Substring(1)) { throw 'Release tag must match the application version.' }

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Build, test and package
        shell: cmd
        run: build.bat

      - name: Verify ZIP contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead('artifacts/release/PlcSim.Slmp-win-x64.zip')
          try {
            foreach ($name in @('PlcSim.Slmp.Gui.exe', 'PlcSim.Slmp.Host.exe', 'config/default.json', 'python/plc_sim.py', 'docs/CONFIGURATION.md')) {
              if (-not $archive.GetEntry("PlcSim.Slmp/$name")) { throw "Missing ZIP entry: $name" }
            }
          } finally { $archive.Dispose() }

      - name: Verify executable versions
        shell: pwsh
        env:
          CHECK_TAG: ${{ github.ref_name }}
        run: |
          foreach ($name in @('PlcSim.Slmp.Gui.exe', 'PlcSim.Slmp.Host.exe')) {
            $info = (Get-Item -LiteralPath "artifacts/release/$name").VersionInfo
            if ($info.ProductVersion.Split('+')[0] -cne $env:CHECK_TAG.Substring(1)) { throw "Wrong executable version: $name" }
          }

      - name: Prepare ZIP checksum and English release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python .github/scripts/release_assets.py prepare --repository "$env:GITHUB_REPOSITORY" --release-tag "$env:RELEASE_TAG" --asset-name PlcSim.Slmp-win-x64.zip --zip artifacts/release/PlcSim.Slmp-win-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish ZIP and checksum
        id: publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag', '--title', "PLC Sim $env:RELEASE_TAG", '--notes-file', 'artifacts/release/release-notes.md',
            'artifacts/release/PlcSim.Slmp-win-x64.zip', 'artifacts/release/PlcSim.Slmp-win-x64.zip.sha256')
          if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "release_tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT

  check-published-release:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/virustotal-release.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
